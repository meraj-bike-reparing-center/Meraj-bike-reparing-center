<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meraj Bike Repairing Centre</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #e63946;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #f8f9fa;
            --text-muted: #b0b0b0;
            --whatsapp-green: #25d366;
            --accent-yellow: #ffb703;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            line-height: 1.6;
            padding-bottom: 70px;
        }

        header {
            background: linear-gradient(135deg, #1a1a1a, #2c2c2c);
            padding: 22px 15px;
            text-align: center;
            border-bottom: 3px solid var(--primary-red);
        }

        .logo-area h1 {
            font-size: 1.8rem;
            color: var(--text-light);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-area h1 span {
            color: var(--primary-red);
        }

        .tagline {
            font-size: 0.95rem;
            color: var(--accent-yellow);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .location-badge, .time-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
        }

        .location-badge {
            background: rgba(230, 57, 70, 0.2);
            color: #ff6b6b;
            border: 1px solid var(--primary-red);
        }

        .time-badge {
            background: rgba(255, 183, 3, 0.2);
            color: var(--accent-yellow);
            border: 1px solid var(--accent-yellow);
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Instagram Banner */
        .insta-banner {
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .insta-banner h3 {
            font-size: 1.25rem;
            margin-bottom: 6px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .insta-banner p {
            font-size: 0.95rem;
            margin-bottom: 14px;
            opacity: 0.95;
            line-height: 1.5;
        }

        .insta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: white;
            color: #fd1d1d;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            text-decoration: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .insta-btn:hover {
            transform: scale(1.06);
            background: #f8f9fa;
        }

        .emergency-box {
            background: rgba(230, 57, 70, 0.15);
            border: 1px solid var(--primary-red);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            text-align: center;
        }

        .emergency-box h4 {
            color: var(--accent-yellow);
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        .emergency-box p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-call { background-color: var(--primary-red); }
        .btn-whatsapp { background-color: var(--whatsapp-green); }
        .btn-map { background-color: #4285F4; }

            padding: 20px;

        .offer-title {

            margin-bottom: 12px;
            font-weight: bold;
        }

        .offer-img {
            width: 100%;

            object-fit: cover;

            margin-bottom: 12px;
        }

        .offer-desc {
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 1.2rem;
            margin: 20px 0 12px 0;
            color: var(--text-light);
            border-left: 4px solid var(--primary-red);

        .services-grid {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;

        }

        .service-item {
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .service-item i {
            color: var(--primary-red);
        }

        .reviews-box {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .review-card {
            background: #121212;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid var(--accent-yellow);
        }

        .review-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-style: italic;
        }

        .review-card span {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: bold;
        }

        .form-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px;

            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 0.95rem;
        }

        textarea.form-control {
            resize: vertical;
            height: 80px;
        }
